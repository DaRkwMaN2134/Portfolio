services:
  db:
    image: postgres:16-alpine
    ports:
      - ${DB_PORTS}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - ${APP_PORTS}
    environment:
    - ConnectionStrings__Postgres=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USERNAME};Password=${DB_PASSWORD};GSS Encryption Mode=Disable
    - ConnectionStrings__Redis=redis:${REDIS_PORT}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrator:
    build:
      context: .
      target: ef-migrator
    environment:
      - ConnectionStrings__Postgres=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USERNAME};Password=${DB_PASSWORD}
    command: dotnet ef database update --project ShortUrl.Infrastructure --startup-project ShortUrl.Presentation
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: my-redis
    ports:
      - ${REDIS_PORTS}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: