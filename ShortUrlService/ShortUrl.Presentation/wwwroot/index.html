<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Сокращение ссылок</title>
				<style>
					* {
					box-sizing: border-box;
					margin: 0;
					padding: 0;
					}

					body {
					min-height: 100vh;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 24px;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
					background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
					background-attachment: fixed;
					}

					.card {
					width: 100%;
					max-width: 540px;
					background: #ffffff;
					border-radius: 24px;
					padding: 40px 36px 32px;
					box-shadow: 0 24px 60px rgba(17, 12, 46, 0.25);
					}

					.card h1 {
					font-size: 26px;
					font-weight: 700;
					color: #1a1a2e;
					text-align: center;
					letter-spacing: -0.5px;
					}

					.subtitle {
					text-align: center;
					color: #8a8fa3;
					font-size: 14px;
					margin-top: 8px;
					margin-bottom: 28px;
					}

					/* ---------- Поле ввода ---------- */
					.input-wrap {
					position: relative;
					}

					.input-wrap input {
					width: 100%;
					padding: 16px 18px;
					font-size: 15px;
					color: #1a1a2e;
					background: #f7f8fc;
					border: 2px solid #e6e8f0;
					border-radius: 14px;
					outline: none;
					transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
					}

					.input-wrap input::placeholder {
					color: #a8adc0;
					}

					.input-wrap input:focus {
					background: #ffffff;
					border-color: #667eea;
					box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
					}

					.input-wrap.error input {
					border-color: #ef4444;
					box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
					animation: shake 0.35s ease;
					}

					@keyframes shake {
					0%, 100% { transform: translateX(0); }
					25%      { transform: translateX(-6px); }
					75%      { transform: translateX(6px); }
					}

					/* ---------- Чекбокс ---------- */
					.checkbox {
					display: flex;
					align-items: center;
					gap: 10px;
					margin: 20px 0 24px;
					cursor: pointer;
					user-select: none;
					font-size: 14px;
					color: #545a70;
					}

					.checkbox input {
					position: absolute;
					opacity: 0;
					pointer-events: none;
					}

					.checkbox .box {
					flex: 0 0 auto;
					width: 20px;
					height: 20px;
					border: 2px solid #d3d7e3;
					border-radius: 6px;
					background: #ffffff;
					position: relative;
					transition: background 0.2s, border-color 0.2s;
					}

					.checkbox .box::after {
					content: "";
					position: absolute;
					left: 6px;
					top: 2px;
					width: 5px;
					height: 10px;
					border: solid #ffffff;
					border-width: 0 2.5px 2.5px 0;
					transform: rotate(45deg) scale(0);
					transition: transform 0.15s ease;
					}

					.checkbox input:checked + .box {
					background: #667eea;
					border-color: #667eea;
					}

					.checkbox input:checked + .box::after {
					transform: rotate(45deg) scale(1);
					}

					.checkbox:hover .box {
					border-color: #667eea;
					}

					/* ---------- Кнопка ---------- */
					.btn-shorten {
					width: 100%;
					padding: 16px;
					font-size: 16px;
					font-weight: 600;
					color: #ffffff;
					background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
					border: none;
					border-radius: 14px;
					cursor: pointer;
					letter-spacing: 0.2px;
					transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
					box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
					}

					.btn-shorten:hover:not(:disabled) {
					transform: translateY(-2px);
					box-shadow: 0 12px 26px rgba(102, 126, 234, 0.45);
					}

					.btn-shorten:active:not(:disabled) {
					transform: translateY(0);
					box-shadow: 0 6px 14px rgba(102, 126, 234, 0.35);
					}

					.btn-shorten:disabled {
					opacity: 0.7;
					cursor: progress;
					transform: none;
					}

					/* ---------- Сообщение об ошибке ---------- */
					.error-msg {
					margin-top: 14px;
					font-size: 13px;
					color: #ef4444;
					text-align: center;
					display: none;
					}

					.error-msg.visible {
					display: block;
					}

					/* ---------- Панель сгенерированных ссылок ---------- */
					.links-panel {
					max-height: 0;
					overflow: hidden;
					opacity: 0;
					transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
					}

					.links-panel.open {
					max-height: 420px;
					opacity: 1;
					margin-top: 24px;
					overflow-y: auto;
					}

					.links-panel::-webkit-scrollbar {
					width: 6px;
					}

					.links-panel::-webkit-scrollbar-thumb {
					background: #dfe2ee;
					border-radius: 3px;
					}

					.links-title {
					font-size: 12px;
					font-weight: 700;
					text-transform: uppercase;
					letter-spacing: 1px;
					color: #a8adc0;
					margin-bottom: 12px;
					}

					.links-list {
					list-style: none;
					display: flex;
					flex-direction: column;
					gap: 10px;
					}

					.link-item {
					background: #f7f8fc;
					border: 1px solid #eceef6;
					border-radius: 14px;
					padding: 12px 14px;
					animation: fadeIn 0.3s ease;
					}

					@keyframes fadeIn {
					from { opacity: 0; transform: translateY(-6px); }
					to   { opacity: 1; transform: translateY(0); }
					}

					.link-original {
					font-size: 12px;
					color: #9aa0b5;
					white-space: nowrap;
					overflow: hidden;
					text-overflow: ellipsis;
					margin-bottom: 6px;
					}

					.link-row {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 10px;
					}

					.link-short {
					font-size: 15px;
					font-weight: 600;
					color: #667eea;
					text-decoration: none;
					word-break: break-all;
					}

					.link-short:hover {
					text-decoration: underline;
					}

					.btn-copy {
					flex: 0 0 auto;
					padding: 6px 12px;
					font-size: 12px;
					font-weight: 600;
					color: #667eea;
					background: #ffffff;
					border: 1.5px solid #dfe3f5;
					border-radius: 9px;
					cursor: pointer;
					transition: background 0.2s, color 0.2s, border-color 0.2s;
					}

					.btn-copy:hover {
					background: #667eea;
					border-color: #667eea;
					color: #ffffff;
					}

					.btn-copy.copied {
					background: #22c55e;
					border-color: #22c55e;
					color: #ffffff;
					}

					.empty {
					text-align: center;
					font-size: 13px;
					color: #b3b8c9;
					padding: 16px 0 4px;
					}

					@media (max-width: 480px) {
					.card {
					padding: 30px 22px 26px;
					border-radius: 20px;
					}
					.card h1 {
					font-size: 22px;
					}
					}
				</style>
			</head>
	<body>

		<div class="card">
			<h1>Сократить ссылку</h1>
			<p class="subtitle">Вставьте длинную ссылку и получите короткую</p>

			<div class="input-wrap" id="inputWrap">
				<input
				  type="text"
				  id="urlInput"
				  placeholder="https://example.com/очень/длинная/ссылка"
				  autocomplete="off"
				  spellcheck="false"
      >
				</div>

			<label class="checkbox">
				<input type="checkbox" id="toggleLinks">
					<span class="box"></span>
					<span>Показать сгенерированные ссылки</span>
				</label>

			<button class="btn-shorten" id="shortenBtn">Сократить</button>

			<p class="error-msg" id="errorMsg"></p>

			<div class="links-panel" id="linksPanel">
				<div class="links-title">Ваши ссылки</div>
				<ul class="links-list" id="linksList"></ul>
				<p class="empty" id="emptyState">Пока ничего не сгенерировано</p>
			</div>
		</div>

		<script>
			/* ============================================================
			★ НАСТРОЙКИ ПОД СВОЙ БЭКЕНД — правь только эти три места
			============================================================ */

			// 1) URL эндпоинта. Если бэкенд на другом домене — укажи полный URL,
			//    например 'http://localhost:5000/'. Не забудь про CORS.
			const API_URL = '/shorten';

			// 2) Как называется поле с длинной ссылкой в теле запроса.
			//    Например, если бэкенд ждёт { "long_url": "..." } — поставь 'long_url'.
			const REQUEST_FIELD = 'LongUrl';

			// 3) Как называется поле с короткой ссылкой в ответе.
			//    Например, 'shortUrl', 'short_url', 'result', 'link'...
			const RESPONSE_FIELD = 'shortUrl';

			/* ============================================================ */

			const inputWrap  = document.getElementById('inputWrap');
			const input      = document.getElementById('urlInput');
			const shortenBtn = document.getElementById('shortenBtn');
			const toggle     = document.getElementById('toggleLinks');
			const panel      = document.getElementById('linksPanel');
			const list       = document.getElementById('linksList');
			const emptyState = document.getElementById('emptyState');
			const errorMsg   = document.getElementById('errorMsg');

			const links = [];
			let isBusy = false;

			/* --- Раскрытие / скрытие панели --- */
			toggle.addEventListener('change', () => {
			panel.classList.toggle('open', toggle.checked);
			});

			/* --- Нормализация и проверка ссылки --- */
			function normalizeUrl(value) {
			let raw = value.trim();
			if (!raw) return null;
			if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
			try {
			const url = new URL(raw);
			if (!url.hostname.includes('.')) return null;
			return url.href;
			} catch (e) {
			return null;
			}
			}

			/* ============================================================
			★ ВОТ ОНА — функция с fetch
			============================================================ */
			async function shortenUrl(longUrl) {
			const response = await fetch(API_URL, {
			method: 'POST',
			headers: {
			'Content-Type': 'application/json',
			// Если бэкенд требует токен — раскомментируй и подставь:
			// 'Authorization': 'Bearer ' + YOUR_TOKEN,
			},
			body: JSON.stringify({ [REQUEST_FIELD]: longUrl }),
			});

			// fetch НЕ бросает ошибку на 4xx/5xx — проверяем вручную
			if (!response.ok) {
			let details = '';
			try {
			const errBody = await response.json();
			details = errBody.error || errBody.message || '';
			} catch (_) {}
			throw new Error(
			`Сервер вернул ${response.status}${details ? ': ' + details : ''}`
			);
			}

			const data = await response.json();
			const shortUrl = data[RESPONSE_FIELD];

			if (typeof shortUrl !== 'string' || !shortUrl) {
			throw new Error(
			`В ответе нет поля "${RESPONSE_FIELD}". Ответ сервера: ` +
			JSON.stringify(data)
			);
			}

			return shortUrl;
			}

			/* --- Индикация загрузки --- */
			function setBusy(busy) {
			isBusy = busy;
			shortenBtn.disabled = busy;
			shortenBtn.textContent = busy ? 'Сокращаем…' : 'Сократить';
			}

			/* --- Сообщение об ошибке --- */
			function showError(message) {
			errorMsg.textContent = message;
			errorMsg.classList.add('visible');
			}
			function clearError() {
			errorMsg.textContent = '';
			errorMsg.classList.remove('visible');
			}

			/* --- Отрисовка одной ссылки --- */
			function renderLink(item) {
			const li = document.createElement('li');
			li.className = 'link-item';

			const original = document.createElement('div');
			original.className = 'link-original';
			original.textContent = item.original;
			original.title = item.original;

			const row = document.createElement('div');
			row.className = 'link-row';

			const short = document.createElement('a');
			short.className = 'link-short';
			short.href = item.short;
			short.target = '_blank';
			short.rel = 'noopener noreferrer';
			short.textContent = item.short;

			const copyBtn = document.createElement('button');
			copyBtn.className = 'btn-copy';
			copyBtn.type = 'button';
			copyBtn.textContent = 'Копировать';

			copyBtn.addEventListener('click', () => {
			copyToClipboard(item.short);
			copyBtn.textContent = 'Скопировано';
			copyBtn.classList.add('copied');
			setTimeout(() => {
			copyBtn.textContent = 'Копировать';
			copyBtn.classList.remove('copied');
			}, 1400);
			});

			row.append(short, copyBtn);
			li.append(original, row);
			return li;
			}

			/* --- Копирование в буфер --- */
			function copyToClipboard(text) {
			if (navigator.clipboard && window.isSecureContext) {
			navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
			} else {
			fallbackCopy(text);
			}
			}

			function fallbackCopy(text) {
			const ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand('copy'); } catch (e) {}
			document.body.removeChild(ta);
			}

			/* --- Обработка кнопки «Сократить» (теперь async) --- */
			async function handleShorten() {
			if (isBusy) return;
			clearError();

			const normalized = normalizeUrl(input.value);

			if (!normalized) {
			inputWrap.classList.remove('error');
			void inputWrap.offsetWidth; // перезапуск анимации
			inputWrap.classList.add('error');
			input.focus();
			return;
			}

			inputWrap.classList.remove('error');
			setBusy(true);

			try {
			// ★ здесь вызывается fetch
			const shortUrl = await shortenUrl(normalized);

			const item = { original: normalized, short: shortUrl };
			links.unshift(item);

			if (links.length === 1) {
			emptyState.style.display = 'none';
			}

			list.prepend(renderLink(item));

			// Автоматически раскрываем панель, чтобы пользователь увидел результат
			if (!toggle.checked) {
			toggle.checked = true;
			panel.classList.add('open');
			}

			input.value = '';
			} catch (err) {
			console.error('Shorten error:', err);

			if (err instanceof TypeError) {
			// TypeError от fetch = сетевая ошибка (сервер недоступен, CORS и т.п.)
			showError('Не удалось связаться с сервером. Проверьте, что бэкенд запущен и CORS настроен.');
			} else {
			showError(err.message || 'Неизвестная ошибка.');
			}
			} finally {
			setBusy(false);
			input.focus();
			}
			}

			shortenBtn.addEventListener('click', handleShorten);

			input.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') handleShorten();
			});

			input.addEventListener('input', () => {
			inputWrap.classList.remove('error');
			clearError();
			});
		</script>
	</body>
</html>
