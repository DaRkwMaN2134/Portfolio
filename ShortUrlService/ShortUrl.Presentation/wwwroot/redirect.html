<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'></meta>
    <title>Перенаправление...</title>
    <style>
        body {{ font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }}
        .loader {{ border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }}
        @keyframes spin {{ 0% {{ transform: rotate(0deg); }} 100% {{ transform: rotate(360deg); }} }}
    </style>
</head>
<body>
    <div class='loader'></div>
    <script>
		// 1. Читаем параметры из URL (url и code)
		const params = new URLSearchParams(window.location.search);
		const longUrl = decodeURIComponent(params.get('url'));
		const shortCode = decodeURIComponent(params.get('code'));

		// 2. Собираем данные для аналитики
		const data = {
		shortCode: shortCode,
		resolution: window.screen.width + 'x' + window.screen.height,
		timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
		deviceLocalTime: new Date().toISOString()
		};

		// 3. Отправляем данные на сервер
		const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
		navigator.sendBeacon('/api/click/update', blob);

		// 4. Перенаправляем пользователя на оригинальный сайт
		if (longUrl) {
		window.location.replace(longUrl);
		} else {
		document.body.innerHTML = "<h1>Ошибка: ссылка не найдена</h1>";
		}
	</script>
</body>
</html>
